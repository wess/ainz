name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install pyte==0.8.2
      - run: python scripts/tui-check.py
      - run: python tests/tui/output.py
      - run: python tests/tui/mascot.py
      - run: python tests/tui/themes.py
      - run: cargo test --locked -p termweave --no-default-features
      - run: cargo test --locked -p termweave --all-features
      - run: cargo clippy --locked -p termweave --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps
      - run: for script in install.sh scripts/package.sh scripts/version.sh; do sh -n "$script"; done

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun test tests/site

  embedding:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        features: ["", "cli", "lua", "wasm"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo clippy --locked --no-default-features --features '${{ matrix.features }}' --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features --features '${{ matrix.features }}' --all-targets
      - if: matrix.features == ''
        run: cargo run --manifest-path tests/fixtures/embedding/Cargo.toml
