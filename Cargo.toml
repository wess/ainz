[package]
name = "ainz"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small, embeddable agent harness"
repository = "https://github.com/wess/ainz"
homepage = "https://wess.io/ainz/"
# ainz ships as a binary through GitHub releases, Homebrew, and `cargo install --git`
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v7"] }
wasmtime = { version = "48.0", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
