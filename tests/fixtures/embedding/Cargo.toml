[package]
name = "embedding"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "embedding"
path = "../../../examples/embedded.rs"

[dependencies]
ainz = { path = "../../..", default-features = false }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
uuid = { version = "1", features = ["v7"] }
